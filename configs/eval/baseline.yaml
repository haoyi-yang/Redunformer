# Weeks 1–2: baseline evaluation
seed: 42
model_config: "configs/models/qwen3.5-4b.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 32  # dev subset; set null in dataset yaml or override for full test split

eval:
  run_perplexity: true
  max_length: 2048
  stride: 512
  batch_size: 1
  run_lm_eval: false
  lm_eval_tasks:
    - "piqa"
    - "arc_easy"
  lm_eval_limit: 100
  lm_eval_batch_size: 1

output_dir: "experiments/results"
use_fallback_model: false

# Qwen3-4B 4-bit baseline (weights available; dense causal LM).
seed: 42
model_config: "configs/models/qwen3-4b.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 32

eval:
  run_perplexity: true
  max_length: 2048
  stride: 512
  batch_size: 1
  run_lm_eval: false

output_dir: "experiments/results"

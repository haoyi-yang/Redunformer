# Qwen3.5-9B full WikiText-2 test split baseline.
# Reproduces Henrik's #11 run (PPL 12.90 on 2026-06-20). Requires a ~16 GB GPU in 4-bit.
seed: 42
model_config: "configs/models/qwen3.5-9b.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"

eval:
  run_perplexity: true
  max_length: 2048
  stride: 512
  batch_size: 1
  run_lm_eval: false

output_dir: "experiments/results"
use_fallback_model: false

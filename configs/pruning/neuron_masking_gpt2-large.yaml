# Weeks 9-10 neuron masking intervention - GPT-2 large (774M).
#
# Top of the GPT-2 size axis. Same sweep as the gpt2 and gpt2-medium configs;
# the PIQA batch is smaller because the model is 6x the small one and the
# evaluation runs in fp32.
seed: 42
model_config: "configs/models/gpt2-large.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 256

measurement_path: "auto"

pruning:
  strategies: ["importance", "frequency", "random"]
  ratios: [0.05, 0.10, 0.25, 0.50]
  layers: "all"
  log_y: true

eval:
  max_length: 1024        # GPT-2 context limit
  stride: 512
  run_lm_eval: true
  lm_eval_tasks: ["piqa"]
  lm_eval_limit: 500
  lm_eval_batch_size: 8

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

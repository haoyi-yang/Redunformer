# H3 behavioural half: mask Llama-2-7B by a PIQA-calibrated importance ranking.
seed: 42
model_config: "configs/models/llama2-7b.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 256

measurement_path: "auto"

pruning:
  strategies: ["importance", "random"]
  ratios: [0.10, 0.25]
  layers: "all"
  log_y: true

eval:
  max_length: 2048
  stride: 512
  run_lm_eval: true
  lm_eval_tasks: ["piqa"]
  lm_eval_limit: 200
  lm_eval_batch_size: 4

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

# Weeks 9-10 duplicate-neuron ablation (H5) - GPT-2 small.
#
# Tests whether the "twins are cheap to drop singly" effect found on Qwen is a
# property of gated FFNs or of trained transformers generally: GPT-2 has no
# gate, so a positive result here rules out the SwiGLU-specific explanation.
seed: 42
model_config: "configs/models/gpt2.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 512

measurement_path: "auto"

pairs:
  min_abs_corr: 0.9
  max_pairs_per_layer: 8
  layers: "all"

eval:
  max_length: 1024        # GPT-2 context limit
  stride: 512

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"

# Weeks 11-12 (H3, behavioural half): mask by a PIQA-calibrated ranking.
#
# The set-overlap analysis (run_task_overlap.py) shows the two corpora nominate
# noticeably different neurons for removal. This run asks whether that matters:
# if a PIQA-derived ranking preserves PIQA accuracy better than the WikiText-2
# ranking at the same sparsity, redundancy is task-specific (H3). If the two are
# indistinguishable, the disagreement is cosmetic.
#
# Eval settings deliberately match neuron_masking_qwen3_0.6b.yaml (same slice,
# same seed, same PIQA limit) so the two runs can be compared row by row.
seed: 42
model_config: "configs/models/qwen3-0.6b.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 256

# Pinned, not "auto": this run must use the PIQA-calibrated artifact.
measurement_path: "experiments/results/measurement_piqacalib_Qwen__Qwen3-0.6B_20260730T000856Z.json"

pruning:
  # `random` is ranking-independent, so it reproduces the WikiText-ranked run's
  # random arm and doubles as a consistency check on the two runs.
  strategies: ["importance", "random"]
  ratios: [0.10, 0.25]
  layers: "all"
  log_y: true

eval:
  max_length: 2048
  stride: 512
  run_lm_eval: true
  lm_eval_tasks: ["piqa"]
  lm_eval_limit: 500
  lm_eval_batch_size: 16

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

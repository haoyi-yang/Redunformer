# Weeks 11-12 duplicate-neuron replacement (merge) - GPT-2 small.
#
# Mirrors pair_ablation_gpt2.yaml so the merge arms are directly comparable to
# the mask-only numbers: same pairs, same eval slice, same seed.
#
# This is the cross-family test of the repair result. On Qwen, handing a
# redundant neuron's contribution to its partner recovered most of the masking
# cost. GPT-2's duplicate pairs are at least as tight (rho up to 0.9999) but
# carry more importance, so the fit quality (r2) matters more here.
seed: 42
model_config: "configs/models/gpt2.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 512

measurement_path: "auto"

pairs:
  min_abs_corr: 0.9
  max_pairs_per_layer: 8
  layers: "all"

fit:
  dataset_config: "configs/datasets/wikitext2_calib.yaml"
  seq_len: 512
  num_blocks: 32

eval:
  max_length: 1024        # GPT-2 context limit
  stride: 512

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

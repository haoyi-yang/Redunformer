# Weeks 9-10 neuron masking intervention - Llama-2-7B (4-bit).
#
# The PIQA arm is smaller than in the Qwen sweep: a 4-bit 7B forward pass leaves
# little headroom on 8 GB, and each extra ratio costs a full harness pass.
seed: 42
model_config: "configs/models/llama2-7b.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 256

measurement_path: "auto"

pruning:
  strategies: ["importance", "frequency", "random"]
  ratios: [0.05, 0.10, 0.25, 0.50]
  layers: "all"
  log_y: true

eval:
  max_length: 2048
  stride: 512
  run_lm_eval: true
  lm_eval_tasks: ["piqa"]
  lm_eval_limit: 200
  lm_eval_batch_size: 4

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

# Weeks 9-10 neuron masking intervention — Qwen3-0.6B small control model.
seed: 42
model_config: "configs/models/qwen3-0.6b.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 256

measurement_path: "auto"

pruning:
  strategies: ["importance", "frequency", "random"]
  ratios: [0.05, 0.10, 0.25, 0.50]
  layers: "all"
  log_y: true

eval:
  max_length: 2048
  stride: 512
  run_lm_eval: true       # PIQA on the masked in-memory model (H-criteria in Q4)
  lm_eval_tasks: ["piqa"]
  lm_eval_limit: 500
  lm_eval_batch_size: 16

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

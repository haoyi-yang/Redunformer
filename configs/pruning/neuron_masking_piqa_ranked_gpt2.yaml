# H3 behavioural half: mask GPT-2 by a PIQA-calibrated importance ranking.
#
# Eval settings match neuron_masking_gpt2.yaml so rows are comparable to the
# WikiText-ranked sweep. Pass the PIQA measurement JSON with --measurement;
# measurement_path below is a placeholder until that artifact exists.
seed: 42
model_config: "configs/models/gpt2.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 256

measurement_path: "auto"

pruning:
  strategies: ["importance", "random"]
  ratios: [0.10, 0.25]
  layers: "all"
  log_y: true

eval:
  max_length: 1024
  stride: 512
  run_lm_eval: true
  lm_eval_tasks: ["piqa"]
  lm_eval_limit: 500
  lm_eval_batch_size: 16

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

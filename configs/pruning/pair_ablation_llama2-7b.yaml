# Weeks 13-14 duplicate-neuron ablation (H5) - Llama-2-7B.
#
# Third family for H5, and the only one where the matched-importance control has
# a large pool to draw from: 11008 neurons per layer against GPT-2's 3072. If
# the control coverage is still well below 1.0 here, the mismatch is a property
# of duplicate neurons being important, not of the layers being too narrow.
seed: 42
model_config: "configs/models/llama2-7b.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 512

measurement_path: "auto"

pairs:
  min_abs_corr: 0.9
  max_pairs_per_layer: 8
  layers: "all"

eval:
  max_length: 2048
  stride: 1024

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"

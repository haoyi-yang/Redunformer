# Weeks 11-12 LoRA recovery — Qwen3.5-4B on Colab (T4 16 GB+).
#
# Same experiment as lora_qwen3.5-4b.yaml, but sized for a card that can actually
# finish a 4-bit backward pass. On the 8 GB laptop this OOM'd into host spilling;
# T4 has roughly twice the usable VRAM, so we restore 512-token blocks and a
# longer training budget closer to the 0.6B run.
seed: 42
model_config: "configs/models/qwen3.5-4b_colab.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 128

# Pin the Weeks 5-8 4B measurement. After cloning the repo on Colab, upload
# measurement_Qwen__Qwen3.5-4B_20260629T183140Z.{json,npz} into experiments/results/
# (they are gitignored) — see the notebook.
measurement_path: "experiments/results/measurement_Qwen__Qwen3.5-4B_20260629T183140Z.json"
strategy: "importance"
layers: "all"
ratios: [0.10]
train_unmasked_control: true

train_data:
  dataset_config: "configs/datasets/wikitext2_calib.yaml"
  seq_len: 512
  num_blocks: 128

recovery:
  rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj"]
  learning_rate: 2.0e-4
  steps: 100
  batch_size: 1
  grad_accum: 8           # effective batch 8 x 512 tokens
  warmup_steps: 10
  gradient_checkpointing: true

eval:
  max_length: 2048
  stride: 512
  run_lm_eval: true
  lm_eval_tasks: ["piqa"]
  lm_eval_limit: 200
  lm_eval_batch_size: 4

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

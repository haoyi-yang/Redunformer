# Fast end-to-end smoke test of the recovery pipeline (minutes, not hours).
# Numbers from this config are meaningless — it exists to prove the wiring works
# before committing GPU time to lora_qwen3_0.6b.yaml.
seed: 42
model_config: "configs/models/qwen3-0.6b.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 24

measurement_path: "auto"
strategy: "importance"
layers: "all"
ratios: [0.10]
train_unmasked_control: true

train_data:
  dataset_config: "configs/datasets/wikitext2_calib.yaml"
  seq_len: 256
  num_blocks: 16

recovery:
  rank: 8
  lora_alpha: 16
  learning_rate: 2.0e-4
  steps: 5
  batch_size: 1
  grad_accum: 2
  warmup_steps: 1

eval:
  max_length: 1024
  stride: 512
  run_lm_eval: false

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

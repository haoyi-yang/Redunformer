# Weeks 13-16 LoRA recovery after importance masking - GPT-2 large (774M).
#
# Same recipe as lora_gpt2.yaml and lora_gpt2-medium.yaml. Batch size stays at
# 2 x 4 so the adapter budget is identical across the three GPT-2 sizes; 774M
# fp32 plus optimizer state is the largest arm that fits an 8 GB card.
seed: 42
model_config: "configs/models/gpt2-large.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 256

measurement_path: "auto"
strategy: "importance"
layers: "all"
ratios: [0.10, 0.25]
train_unmasked_control: true

train_data:
  dataset_config: "configs/datasets/wikitext2_calib.yaml"
  seq_len: 512
  num_blocks: 256

recovery:
  rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["c_attn", "c_fc"]
  learning_rate: 2.0e-4
  steps: 200
  batch_size: 2
  grad_accum: 4
  warmup_steps: 20
  max_grad_norm: 1.0
  gradient_checkpointing: true

eval:
  max_length: 1024
  stride: 512
  run_lm_eval: true
  lm_eval_tasks: ["piqa"]
  lm_eval_limit: 500
  lm_eval_batch_size: 8

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

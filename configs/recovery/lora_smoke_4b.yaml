# Fast wiring check for the 4-bit (QLoRA) recovery path. Numbers are meaningless;
# this only proves that adapters train on a quantized base with masks live.
seed: 42
model_config: "configs/models/qwen3.5-4b.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 8

measurement_path: "auto"
strategy: "importance"
layers: "all"
ratios: [0.10]
train_unmasked_control: false

train_data:
  dataset_config: "configs/datasets/wikitext2_calib.yaml"
  seq_len: 256
  num_blocks: 8

recovery:
  rank: 8
  lora_alpha: 16
  learning_rate: 2.0e-4
  steps: 3
  batch_size: 1
  grad_accum: 1
  warmup_steps: 1
  gradient_checkpointing: true

eval:
  max_length: 1024
  stride: 512
  run_lm_eval: false

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

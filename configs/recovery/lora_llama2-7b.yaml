# Weeks 11-12 QLoRA recovery after importance masking — Llama-2-7B (4-bit).
#
# Conservative 8 GB settings (short blocks, checkpointing). If the backward
# pass OOMs, this is the same class of failure as the 4B Qwen laptop run.
seed: 42
model_config: "configs/models/llama2-7b.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 128

measurement_path: "auto"
strategy: "importance"
layers: "all"
ratios: [0.10]
train_unmasked_control: true

train_data:
  dataset_config: "configs/datasets/wikitext2_calib.yaml"
  seq_len: 128
  num_blocks: 128

recovery:
  rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj"]
  learning_rate: 2.0e-4
  steps: 60
  batch_size: 1
  grad_accum: 4
  warmup_steps: 6
  gradient_checkpointing: true

eval:
  max_length: 2048
  stride: 512
  run_lm_eval: true
  lm_eval_tasks: ["piqa"]
  lm_eval_limit: 200
  lm_eval_batch_size: 2

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

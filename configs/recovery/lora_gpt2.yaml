# Weeks 11-12 LoRA recovery after importance masking — GPT-2 small.
#
# Target modules are GPT-2 Conv1D names. mlp.c_proj is the FFN down-projection
# analog, so it is omitted (same reason Qwen recovery omits down_proj).
seed: 42
model_config: "configs/models/gpt2.yaml"
dataset_config: "configs/datasets/wikitext2.yaml"
max_samples: 256

measurement_path: "auto"
strategy: "importance"
layers: "all"
ratios: [0.10, 0.25]
train_unmasked_control: true

train_data:
  dataset_config: "configs/datasets/wikitext2_calib.yaml"
  seq_len: 512
  num_blocks: 256

recovery:
  rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["c_attn", "c_fc"]
  learning_rate: 2.0e-4
  steps: 200
  batch_size: 2
  grad_accum: 4
  warmup_steps: 20
  max_grad_norm: 1.0
  gradient_checkpointing: false

eval:
  max_length: 1024
  stride: 512
  run_lm_eval: true
  lm_eval_tasks: ["piqa"]
  lm_eval_limit: 500
  lm_eval_batch_size: 16

output_dir: "experiments/results"
figures_dir: "experiments/results/figures"
use_fallback_model: false

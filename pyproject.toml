[project]
name = "redunformer-neuron"
version = "0.1.0"
description = "Group 5 (neuron / FFN-unit) redundancy experiments for the LLM redundancy seminar"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Redunformer Neuron Team" }]
dependencies = [
    "torch>=2.8.0",
    "transformers>=5.10.0,<6",
    "accelerate>=0.33.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.24.0",
    "lm-eval>=0.4.7",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "pyarrow>=15.0.0",
    "hf-xet>=1.5.0",
    "bitsandbytes>=0.43.0; sys_platform != 'darwin'",
    "peft>=0.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]
wandb = ["wandb>=0.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redundancy"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

# CUDA wheels for local GPU (RTX 4060 8GB). PyPI defaults to CPU-only on Windows.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py310"

[project]
name = "llm-block-redundancy-eval"
version = "0.1.0"
description = "A project for LLm block redundancy evaluation."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "datasets>=2.18.0",
    "lm-eval>=0.4.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "accelerate>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "nnsight",
    "accelerate>=0.27.0",
    "wandb",
    "tensorboard",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"] 

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
